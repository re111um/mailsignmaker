<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Featuring 메일 서명 생성기</title>
  <style>
  <link rel="icon" href="./favicon.svg?v=20251001" type="image/svg+xml">
  <link rel="alternate icon" href="./favicon.ico?v=20251001" sizes="any">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=20251001" sizes="180x180">
    <meta name="theme-color" content="#ffffff">
    :root { --radius: 16px; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; margin: 24px; background:#fff; color:#111; }
    .card { max-width: 880px; padding: 20px; border: 1px solid #e5e7eb; border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,0.05); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { font-weight: 600; font-size: 14px; color:#111; display:block; margin-bottom: 6px; }
    input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; font-size:14px; }
    .row { display:flex; gap:12px; align-items:center; }
    .btn { cursor:pointer; padding:10px 14px; border-radius:12px; border:1px solid #d1d5db; background:#111; color:#fff; font-weight:600; }
    .btn.secondary { background:#fff; color:#111; }
    .hint { color:#6b7280; font-size:12px; }
    .preview-wrap { margin-top: 18px; padding: 16px; border:1px dashed #d1d5db; border-radius:12px; background:#fafafa; }
    .sig td, .sig span, .sig a { font-family: Arial, Helvetica, sans-serif; font-size:10pt; line-height:1.0; color:#111111; }

    /* anchor 버튼을 실제 버튼과 동일하게 (밑줄 제거/폰트 통일) */
    a.btn, a.btn:link, a.btn:visited, a.btn:hover, a.btn:active {
      text-decoration: none !important;
      color: #111 !important;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      font-size: 14px;
      line-height: 1;
      font-weight: 600;
    }

    /* 보조 버튼 묶음 및 메시지 위치 */
    .btn-group { display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; }
    #msg { white-space: nowrap; }
    #msg:empty { display: none; }
   
    /* ▼▼▼ ADD: '부서' 드롭다운 + 두 칸 분할 레이아웃 */
  .split-2 { display:flex; gap:16px; }          /* grid의 gap(16px)과 동일 */
  .split-2 > * { flex:1 1 0; }                  /* 두 입력칸 정확히 반반 */

  .dept { position:relative; }
  .dept details { position:relative; }
  .dept summary { list-style:none; cursor:pointer; user-select:none; }
  .dept summary::-webkit-details-marker { display:none; }
  .dept .input-like {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; background:#fff;
    font-size:14px;
  }
 .dept .dropdown {
    position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0;
    border: 1px solid #d1d5db; border-radius: 10px; background: #fff;
    max-height: 260px;
    overflow-y: auto;        /* 세로 스크롤만 */
    overflow-x: hidden;      /* 가로 스크롤 제거 */
    box-shadow: 0 10px 20px rgba(0,0,0,.08);
    text-align: left;
  }
  .dept .dropdown ul { margin: 8px 0; padding: 0; list-style: none; }
  .dept .dropdown li { margin: 0; padding: 0; }

  /* 라디오 + 텍스트를 같은 줄에서 보이되, 길면 자연스럽게 줄바꿈 */
  .dept .dropdown label {
    display: flex;
    align-items: center;
    gap: 10px;               /* 라디오와 텍스트 간격 */
    width: 100%;             /* 클릭 영역을 가로 전체로 */
    box-sizing: border-box;
    padding: 8px 12px;       /* 항목 패딩 */
    cursor: pointer;

    white-space: normal;     /* 줄바꿈 허용 (nowrap 제거) */
    word-break: keep-all;    /* 한글 단어 단위 유지 */
    overflow-wrap: anywhere; /* 긴 영문/기호도 적절히 줄바꿈 */
    line-height: 1.3;
  }
  .dept .dropdown input[type="radio"] {
    flex: 0 0 auto;          /* 라디오 버튼은 고정 크기 */
    margin: 0;
  }
  /* (선택) 마우스오버 가독성 향상 */
  .dept .dropdown label:hover { background: #f5f5f5; }
   .dept .dropdown {
    overflow-x: hidden !important;    /* 가로 스크롤 제거 */
    text-align: left !important;
  }
  .dept .dropdown ul { margin: 8px 0 !important; padding: 0 !important; list-style: none !important; }
  .dept .dropdown li { margin: 0 !important; padding: 0 !important; }

  .dept .dropdown label {
    display: flex !important;         /* 라디오 + 텍스트 한 줄 */
    align-items: center !important;
    gap: 10px !important;
    width: 100% !important;           /* 클릭 영역 전체 */
    box-sizing: border-box !important;
    padding: 8px 12px !important;

    white-space: normal !important;   /* ← nowrap 무효화 */
    word-break: keep-all !important;  /* 한글 단어 단위 유지 */
    overflow-wrap: anywhere !important; /* 긴 영문/기호 줄바꿈 */
    line-height: 1.3 !important;
    color: #111 !important;           /* 혹시 색상 상속 문제 방지 */
  }
  .dept .dropdown {
    position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0;
    background: #fff; border: 1px solid #d1d5db; border-radius: 10px;
    max-height: 260px; overflow-y: auto; overflow-x: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,.08); text-align: left;
  }
  .dept .dropdown ul { margin: 8px 0; padding: 0; list-style: none; }
  .dept .dropdown li { margin: 0; padding: 0; }
  .dept .dropdown label {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; width: 100%; box-sizing: border-box; cursor: pointer;
    white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
    line-height: 1.3;
  }
  .dept .dropdown input[type="radio"] { margin: 0; flex: 0 0 auto; }
  .dept .dropdown label:hover { background: #f5f5f5; }

  .dept .dropdown { padding: 6px 8px 6px 5px; }             /* 박스 왼쪽 여백 5px */
  .dept .dropdown label {
    display: grid !important;
    grid-template-columns: 12px 1fr !important; /* ◯셀 고정폭(좁게) + 텍스트 가변폭 */
    align-items: center !important;
    column-gap: 5px !important;                 /* 버튼↔텍스트 간격 5px */
    padding: 0 8px 0 0 !important;              /* 위/아래 여백 최소화(텍스트 높이 가까움) */
    line-height: 1.2 !important;                /* 텍스트 행간 */
 }
  .dept .dropdown input[type="radio"] {
    width: 10px !important; height: 10px !important; /* 컨트롤 박스 자체 */
    transform: scale(0.5) !important;                /* 표시 직경 ≈ 5px */
    margin: 0 !important;
 }
  .dept .dropdown .opt { min-width: 0 !important; }  /* 텍스트가 그리드 영역 밖으로 밀리지 않게 */
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px 0;">메일 서명 생성기</h2>
    <p class="hint">아래 4가지만 입력하면 됩니다. [서명 복사]를 눌러 Gmail 메일 서명 설정에 붙여넣으세요.</p>

    <!-- 🔧 ADMIN CONFIG -->
<script>
  window.__SIG_CONFIG__ = {
    address: "서울특별시 강남구 테헤란로 129, 8층 (빗썸금융타워)",
    link1_text: "featuring",
    link1_url: "https://featuring.co",
    link2_text: "featuring enterprise",
    link2_url: "https://enterprise.featuring.co/?utm_source=featuring&utm_medium=gnb",
    logo_width_px: 282,
    logo_height_px: 26,
    /* GitHub Pages의 로고 절대경로 */
    logo_url: "https://re111um.github.io/mailsignmaker/assets/logo.png",
    logo_version: "20250930",

    banner_base: "https://re111um.github.io/mailsignmaker/assets",
    banner_version: "20250930"
  };
</script>

    <div class="grid">
      <div>
        <label>이름 (영문/한글)</label>
        <input id="name" value="Doe 홍길동">
      </div>
    <div>
  <label>부서 / 직함</label>
  <div class="split-2">
    <!-- LEFT: 부서 선택 (라디오 드롭다운) -->
    <div class="dept">
      <details id="deptChooser">
        <summary class="input-like" aria-label="부서 선택">
          <span id="deptSummaryText">경영관리본부</span>
          <span aria-hidden="true">▾</span>
        </summary>
        <div class="dropdown">
          <ul id="deptOptions">
            <!-- ▼ 팀 옵션은 여기 li만 추가/삭제하면 됩니다 -->
          <li><label><input type="radio" name="dept" value="경영관리본부" checked> <span class="opt">경영관리본부</span></label></li>
          <li><label><input type="radio" name="dept" value="Sales&Marketing"> <span class="opt">Sales&Marketing</span></label></li>
          <li><label><input type="radio" name="dept" value="일본사업개발"> <span class="opt">일본사업개발</span></label></li>
          <li><label><input type="radio" name="dept" value="Featuring co."> <span class="opt">Featuring co.</span></label></li>
          <li><label><input type="radio" name="dept" value="Enterprise"> <span class="opt">Enterprise</span></label></li>
          <li><label><input type="radio" name="dept" value="Design"> <span class="opt">Design</span></label></li>
          <li><label><input type="radio" name="dept" value="Campaign"> <span class="opt">Campaign</span></label></li>
          <li><label><input type="radio" name="dept" value="Commerce"> <span class="opt">Commerce</span></label></li>
      </ul>
          </ul>
        </div>
      </details>
      <!-- 선택 값을 보관하는 hidden input -->
      <input type="hidden" id="deptValue" value="경영관리본부">
    </div>

    <!-- RIGHT: 직함 자유 입력 -->
    <div>
      <input id="jobtitle" placeholder="직함 입력" value="HR Manager">
    </div>
  </div>
</div>
      <div>
        <label>이메일</label>
        <input id="email" value="doe@featuring.in">
      </div>
      <div>
        <label>휴대폰</label>
        <input id="mobile" value="010 1234 5678">
      </div>
    </div>

    <div class="row" style="margin-top:16px;">
      <button class="btn" id="copyHtml">서명 복사</button>

      <!-- 보조 버튼 묶음 -->
      <div class="btn-group">
        <a class="btn secondary" href="#" onclick="selectPreview(false); return false;">미리보기 선택</a>
        <a class="btn secondary" id="openGmailSettings"
           href="https://mail.google.com/mail/u/0/?tab=rm&ogbl#settings/general"
           target="_blank" rel="noopener noreferrer">메일서명설정 바로가기</a>
        <span id="msg" class="hint"></span>
      </div>
    </div>

    <div class="preview-wrap">
      <div id="preview" class="sig"></div>
    </div>
  </div>

  <script>
    function escapeHtml(str){return str.replace(/[&<>'"]/g, t=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]));}
    function h(v){return escapeHtml(v.trim());}

      function formatMobileKR(raw){
    const d = (raw || '').replace(/\D+/g, ''); // 숫자만 추출
    if (d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1 $2 $3'); // 010 1234 5678
    if (d.length === 10) return d.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1 $2 $3'); // 011 234 5678 등
    return raw; // 그 외 길이: 입력 그대로
  }
  <!-- ADD END -->

  function formatNameBoldEnglishOnly(nameRaw){
    /* ...기존 그대로... */
  }
    
    function formatNameBoldEnglishOnly(nameRaw){
      const name = nameRaw;
      const m = name.match(/^[\x20-\x7E]+/);
      if (!m) return name;
      const eng = m[0].trimEnd();
      if (!eng) return name;
      const rest = name.slice(eng.length);
      return '<span style="font-weight:700;">' + eng + '</span>' + rest;
    }

function build(){
  // __SIG_CONFIG__ 없을 때도 터지지 않도록 안전 기본값 병합
  const C = Object.assign({
    address: "", link1_text: "", link1_url: "#",
    link2_text: "", link2_url: "#",
    logo_width_px: 200, logo_height_px: 17,
    logo_url: "", logo_version: ""
  }, window.__SIG_CONFIG__ || {});

  const name   = h(document.getElementById('name').value);
  const dept   = document.getElementById('deptValue') ? document.getElementById('deptValue').value : "";
  const job    = document.getElementById('jobtitle')  ? h(document.getElementById('jobtitle').value) : "";
  const title  = (dept && job) ? `${dept} / ${job}` : (dept || job);
  const email  = h(document.getElementById('email').value);
  const mobile = document.getElementById('mobile').value;

  const nameHtml = formatNameBoldEnglishOnly(name);

  // 캐시 무력화된 로고 src 계산
  const rawLogo = C.logo_url || "";
  const ver     = String(C.logo_version || "");
  const logoSrc = rawLogo
    ? rawLogo + (rawLogo.includes("?") ? "&" : "?") + "v=" + (ver || Date.now())
    : "";

  const bannerBase = C.banner_base || "";
  const verBanner  = String(C.banner_version || "");
  const introSrc   = bannerBase ? `${bannerBase}/introduction.png?v=${verBanner || Date.now()}` : "";
  const newsSrc    = bannerBase ? `${bannerBase}/newletter.png?v=${verBanner || Date.now()}` : "";
  
  const html = `
  <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size:10pt; line-height:1.0; color:#111111; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
  <tr><td style="padding:0 0 4px 0;">${nameHtml}</td></tr>
  <tr><td style="padding:0 0 4px 0;">${title}</td></tr>
  <tr><td style="padding:0 0 4px 0;"><span style="color:#666;">Mobile.</span> <span>${formatMobileKR ? formatMobileKR(mobile) : mobile}</span></td></tr>
  <tr><td style="padding:0 0 4px 0;"><span style="color:#666;">Email.</span> <a href="mailto:${email}" style="color:#2563eb; text-decoration:underline;">${email}</a></td></tr>
  <tr><td style="padding:0 0 4px 0;"><span style="color:#666;">Address.</span> <span>${C.address}</span></td></tr>
  <tr><td style="padding:0 0 8px 0;"><span style="color:#666;">Link.</span> <a href="${C.link1_url}" style="color:#2563eb; text-decoration:underline;">${C.link1_text}</a> <span style="color:#999;">/</span> <a href="${C.link2_url}" style="color:#2563eb; text-decoration:underline;">${C.link2_text}</a></td></tr>
  <tr><td style="padding:0; font-size:0; line-height:0;">
  ${
    logoSrc ? `<a href="${C.link1_url}" style="display:inline-block; vertical-align:middle;"><img src="${logoSrc}" alt="Company Logo" style="width:${C.logo_width_px}px; height:${C.logo_height_px}px; border:0; vertical-align:middle;"></a>` : ''
  }</td></tr>

<tr><td style="padding:0; font-size:0; line-height:0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"
     style="border-collapse:collapse; font-size:0; line-height:0;">
  <tr>
  ${introSrc ? `
        <td style="padding:0 8px 0 0; font-size:0; line-height:0;">
 <a href="https://drive.google.com/file/d/1kAwEuoOHOst4k6DP3NGJCG1N2QVmc4Oh/view"
target="_blank" rel="noopener noreferrer" style="display:inline-block;">
 <img alt="피처링 회사 소개서"
 src="${introSrc}" width="170" height="52"
  style="display:block; border:0; vertical-align:top;">
  </a>
  </td>` : ''}

   ${newsSrc ? `
    <td style="padding:0; font-size:0; line-height:0;">
      <a href="https://featuring.co/newsletter"
       target="_blank" rel="noopener noreferrer" style="display:inline-block;">
        <img alt="뉴스레터 구독하기"
          src="${newsSrc}" width="173" height="52"
         style="display:block; border:0; vertical-align:top;">
       </a>
     </td>` : ''}
    </tr>
  </table>
 </td></tr>
</table>`;
  document.getElementById('preview').innerHTML = html;
  return html;
}

    function copyHtml(){
      const html = build();
      const helper = document.createElement('div');
      helper.setAttribute('contenteditable', 'true');
      helper.style.position = 'fixed';
      helper.style.left = '-99999px';
      helper.style.whiteSpace = 'pre-wrap';
      helper.innerHTML = html;
      document.body.appendChild(helper);

      const range = document.createRange();
      range.selectNodeContents(helper);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      let ok = false;
      try { ok = document.execCommand('copy'); } catch(e) { ok = false; }

      document.body.removeChild(helper);
      sel.removeAllRanges();

      if (ok) { msg('서명이 클립보드(HTML)로 복사되었습니다.'); return; }
      selectPreview(true);
      msg('자동 복사가 제한되었습니다. Ctrl/⌘+C 로 복사하세요.');
    }

    function selectPreview(focusOnly){
      build();
      const target = document.getElementById('preview');
      if (!target) { msg('미리보기 영역을 찾을 수 없어요.'); return; }
      const range = document.createRange();
      range.selectNode(target);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      if (!focusOnly) msg('미리보기를 선택했습니다. Ctrl/⌘+C 로 복사하세요.');
    }

    function msg(t){
      const el = document.getElementById('msg');
      if (!el) return;
      el.textContent = t;
      setTimeout(()=>{ el.textContent=''; }, 4500);
    }

    /* ▼▼▼ REPLACE FROM HERE: 안전한 이벤트 바인딩 + 초기 렌더 */
    function on(id, type, handler){
      const el = document.getElementById(id);
      if (!el) { console.warn('[bind skipped] #' + id + ' not found'); return; }
      el.addEventListener(type, handler);
    }

    function bindEvents(){
      // 입력 변화 → 미리보기 리렌더
      ['name','jobtitle','email','mobile'].forEach(id => on(id, 'input', build));

      // 서명 복사 버튼
      on('copyHtml', 'click', copyHtml);

      // 부서 라디오(이벤트 위임: li 추가/삭제해도 유지)
      const deptOptions = document.getElementById('deptOptions'); // <ul id="deptOptions">
      if (deptOptions) {
        deptOptions.addEventListener('change', (e) => {
          const r = e.target.closest('input[name="dept"]');
          if (!r) return;
          const v = r.value;
          const hidden = document.getElementById('deptValue');
          const summary = document.getElementById('deptSummaryText');
          const chooser = document.getElementById('deptChooser');
          if (hidden)  hidden.value = v;
          if (summary) summary.textContent = v;
          if (chooser) chooser.open = false; // 선택 후 닫기
          build(); // 프리뷰 갱신
        });
      }
    }

    // 초기 1회: DOM 준비 후 바인딩 + 렌더
    (function init(){
      const start = () => { try { bindEvents(); build(); } catch(e) { console.error(e); } };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start, { once: true });
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
